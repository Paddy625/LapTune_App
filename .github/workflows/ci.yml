name: Test and package Telemetry Viewer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libnss3 libxkbcommon0 libasound2t64
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: test-results.xml
  windows-package:
    runs-on: windows-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m PyInstaller --clean --noconfirm telemetry_viewer.spec
      - name: Test actual frozen application and WebEngine resources
        run: python tests/check_frozen.py dist/TelemetryViewer
      - name: Create portable folder ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/TelemetryViewer -DestinationPath dist/TelemetryViewer-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TelemetryViewer-Windows-x64
          path: dist/TelemetryViewer-Windows-x64.zip
          retention-days: 30
